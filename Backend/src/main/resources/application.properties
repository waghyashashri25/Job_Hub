server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123}
jwt.token-validity-ms=${JWT_TOKEN_VALIDITY_MS:604800000}

# CORS Configuration (production-ready)
CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Optional external API credentials for aggregation
jobs.api.adzuna.app-id=${JOBS_API_ADZUNA_APP_ID:}
jobs.api.adzuna.app-key=${JOBS_API_ADZUNA_APP_KEY:}
jobs.api.jsearch.key=${JOBS_API_JSEARCH_KEY:}
jobs.api.usajobs.key=${JOBS_API_USAJOBS_KEY:}
jobs.api.usajobs.user-agent=${JOBS_API_USAJOBS_USER_AGENT:}
jobs.api.jooble.key=${JOBS_API_JOOBLE_KEY:}

# Scheduler configuration
jobs.scheduler.enabled=${JOBS_SCHEDULER_ENABLED:true}
jobs.scheduler.fixed-rate-ms=${JOBS_SCHEDULER_FIXED_RATE_MS:180000}

# OAuth Configuration (Google & GitHub)
# Set these via environment variables or a .env file — never hardcode credentials here
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}

oauth.github.client-id=${GITHUB_CLIENT_ID:}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/oauth/github/callback}

# Frontend URL for OAuth redirects
app.frontend.url=${FRONTEND_URL:https://job-hub-bay-alpha.vercel.app}

# Jackson Date Serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Real Email Delivery Configuration (JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from-name=${APP_MAIL_FROM_NAME:JobHub AI Platform}
app.mail.from-email=${APP_MAIL_FROM_EMAIL:}

# SMS Gateway Configuration (Optional - Fast2SMS or Twilio or generic)
sms.provider=${SMS_PROVIDER:none}
sms.api-key=${SMS_API_KEY:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# OTP Security Configuration
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}

