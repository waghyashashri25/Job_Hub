databases:
  - name: job-portal-db
    databaseName: job_portal
    plan: free

services:
  - type: web
    name: job-portal-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://*.vercel.app"
      - key: JOBS_SCHEDULER_ENABLED
        value: "true"
      - key: JOBS_SCHEDULER_FIXED_RATE_MS
        value: "600000"
